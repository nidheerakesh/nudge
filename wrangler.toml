name = "nudge"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "nudge-v3"
database_id = "3f671528-05ba-4658-8170-b1177b1158ac"
migrations_dir = "migrations/v3"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "DISTRICT"
class_name = "DistrictDO"

[[durable_objects.bindings]]
name = "HOUSE"
class_name = "HouseDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DistrictDO", "HouseDO"]
