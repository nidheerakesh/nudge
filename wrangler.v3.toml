name = "nudge-v3"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = true
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
[[d1_databases]]
binding = "DB"
database_name = "nudge-v3"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations/v3"
[ai]
binding = "AI"
[[durable_objects.bindings]]
name = "DISTRICT"
class_name = "DistrictDO"
[[durable_objects.bindings]]
name = "HOUSE"
class_name = "HouseDO"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DistrictDO", "HouseDO"]
