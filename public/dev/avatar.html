<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nudge avatar preview</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/css/app.css">
<style>
body{padding:12px 16px}
#bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
#bar label{display:flex;align-items:center;gap:6px;font-size:13px}
#bar select,#bar input,#bar button{width:auto;min-height:36px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);max-width:140px;word-break:break-all;text-align:center}
canvas.av{image-rendering:pixelated;border:1px solid var(--line);background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%);background-size:16px 16px;background-position:0 0,8px 8px}
#main{margin-bottom:16px}
#miss{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:8px;margin-top:16px;word-break:break-all}
</style>
</head>
<body>
<h1>Nudge avatar preview</h1>
<div id="bar"></div>
<div id="main"></div>
<div id="out"></div>
<div id="miss"></div>
<script type="module">
import loadAll from '/town/art/index.js';
import { has, decode } from '/town/art/pixel.js';
import { SKINS, HAIR_NAMES } from '/town/art/palette.js';

const S = 8;
const W = 16;
const H = 24;
const st = { skin: 0, hair: 0, hs: 1, outfit: 'casual', acc: '', dir: 'd', pose: 'walk', play: true };
const miss = new Set();
const cache = new Map();
let mods = {};
let outfits = {};
let accs = [];
let tick = 0;
let mainCv = null;

const el = (t, a, ...k) => {
  const n = document.createElement(t);
  for (const key in a || {}) n.setAttribute(key, a[key]);
  n.append(...k.filter((x) => x != null));
  return n;
};

const DIRS = ['d', 'u', 'l', 'r'];
const POSES = ['walk', 'walk.0', 'walk.1', 'walk.2', 'walk.3', 'idle', 'sit_study', 'break', 'cheer', 'knock'];

// Decode a sprite with given rows, cached by key.
function dec(key, spr, o) {
  const k = key + '|' + JSON.stringify(o);
  let cv = cache.get(k);
  if (!cv) { cv = decode(spr, o, key); cache.set(k, cv); }
  return cv;
}

// Draw a registered sprite by id; a missing id is recorded and skipped.
function lay(ctx, id, x, y, o) {
  if (!has(id)) { miss.add(id); return; }
  ctx.drawImage(dec(id, mods.all[id], o), x, y);
}

// Body sprite with legs recoloured per bottom type (L marks leg pixels).
function body(id, bottom, o) {
  const spr = mods.all[id];
  if (!has(id)) { miss.add(id); return null; }
  const cut = { pants: 99, shorts: 21, skirt: 22 }[bottom] || 0;
  const rows = spr.rows.map((r, i) => (i >= 18 && i >= cut ? r.replaceAll('L', '2') : r));
  return dec(id + '#' + bottom, { w: spr.w, h: spr.h, rows }, o);
}

function frameOf(look, t) {
  const dir = look.dir === 'r' ? 'l' : look.dir;
  const m = /^walk\.(\d)$/.exec(look.pose);
  const an = mods.anims;
  let fr;
  let d = dir;
  if (m) fr = an['walk.' + dir].frames[+m[1]];
  else if (look.pose === 'walk') fr = an['walk.' + dir].frames[t % 4];
  else if (look.pose === 'idle') {
    if (dir === 'd') fr = an['idle.d'].frames[Math.floor(t * 2 / 8) % 2];
    else fr = an['walk.' + dir].frames[0];
  } else {
    const a = an[look.pose];
    d = look.pose === 'knock' ? 'u' : 'd';
    fr = a.frames[Math.floor(t * a.fps / 8) % a.frames.length];
  }
  return { fr, d, flip: look.dir === 'r' && d === 'l' };
}

function compose(look, t) {
  const cv = document.createElement('canvas');
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext('2d');
  const { fr, d, flip } = frameOf(look, t);
  const of = outfits[look.outfit];
  const o = { skin: look.skin, hair: look.hair, colors: of ? of.c : undefined, flip };
  const hy = fr.hy || 0;
  const ty = fr.ty || 0;
  const hx = fr.hx || 0;
  const tx = fr.tx || 0;
  const hs = 'hair.' + look.hs + '.' + d;
  lay(ctx, 'shadow', 2, 21, o);
  lay(ctx, hs + '.back', hx, hy, o);
  const b = body(fr.body, of ? of.bottom : 'pants', o);
  if (b) ctx.drawImage(b, 0, 0);
  if (of && ['skirt', 'dress', 'robe'].includes(of.bottom)) {
    const bid = of.top.replace('.top', '.bottom') + '.' + d;
    if (has(bid)) lay(ctx, bid, 0, 14, o);
    else if (of.bottom !== 'skirt') miss.add(bid);
  }
  lay(ctx, 'head.' + d, 2 + hx, 3 + hy, o);
  if (of) lay(ctx, of.top + '.' + d, tx, 13 + ty, o);
  lay(ctx, hs + '.front', hx, hy, o);
  if (look.acc) lay(ctx, 'acc.' + look.acc + '.' + d, hx, hy, o);
  if (fr.prop) {
    const p = fr.prop;
    lay(ctx, p.id, flip ? W - 8 - p.x : p.x, p.y, o);
  }
  return cv;
}

function paint(cv, src) {
  cv.width = W * S;
  cv.height = H * S;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(src, 0, 0, cv.width, cv.height);
}

const canvas = () => el('canvas', { class: 'av' });

function showMiss() {
  const list = [...miss].sort();
  document.getElementById('miss').replaceChildren(el('b', null, 'missing: '), list.length ? list.join(', ') : 'none');
}

function sel(label, list, key) {
  const s = el('select');
  list.forEach(([v, t]) => { const o = el('option', { value: v }, t); if (String(st[key]) === String(v)) o.selected = true; s.append(o); });
  s.onchange = () => { st[key] = /^\d+$/.test(s.value) ? +s.value : s.value; draw(); };
  return el('label', null, label, s);
}

function grid(title, items) {
  const g = el('div', { class: 'grid' });
  for (const [id, look] of items) {
    const cv = canvas();
    try { paint(cv, compose(look, 0)); } catch (e) { g.append(el('div', { class: 'cell' }, 'error: ' + e.message, el('span', null, id))); continue; }
    g.append(el('div', { class: 'cell' }, cv, el('span', null, id)));
  }
  return el('section', null, el('h2', null, title + ' (' + items.length + ')'), g);
}

function draw() {
  const bar = document.getElementById('bar');
  const btn = el('button', { type: 'button' }, st.play ? 'pause' : 'play');
  btn.onclick = () => { st.play = !st.play; draw(); };
  bar.replaceChildren(
    sel('Skin', SKINS.map((_, i) => [i, 'tone ' + (i + 1)]), 'skin'),
    sel('Hair style', HAIR_NAMES.map((_, i) => [i + 1, 'style ' + (i + 1)]), 'hs'),
    sel('Hair colour', HAIR_NAMES.map((n, i) => [i, n]), 'hair'),
    sel('Outfit', Object.keys(outfits).map((k) => [k, k]), 'outfit'),
    sel('Accessory', [['', 'none'], ...accs.map((a) => [a, a])], 'acc'),
    sel('Direction', DIRS.map((d) => [d, d]), 'dir'),
    sel('Pose', POSES.map((p) => [p, p]), 'pose'),
    btn,
  );
  mainCv = canvas();
  document.getElementById('main').replaceChildren(mainCv);
  const base = { skin: st.skin, hair: st.hair, hs: st.hs, outfit: st.outfit, acc: st.acc, dir: 'd', pose: 'walk' };
  document.getElementById('out').replaceChildren(
    grid('Outfits', Object.keys(outfits).map((k) => [k, { ...base, outfit: k }])),
    grid('Hair styles', HAIR_NAMES.map((_, i) => ['hair.' + (i + 1), { ...base, hs: i + 1 }])),
    grid('Accessories', accs.map((a) => [a, { ...base, acc: a }])),
  );
  frame();
  showMiss();
}

function frame() {
  if (!mainCv) return;
  const n = miss.size;
  try { paint(mainCv, compose(st, tick)); } catch (e) { console.warn('avatar', e); }
  if (miss.size !== n) showMiss();
}

setInterval(() => {
  if (!st.play) return;
  tick++;
  frame();
}, 125);

loadAll().then(async () => {
  const [body_, hair, acc, oa, ob] = await Promise.all(['body', 'hair', 'accessories', 'outfits_a', 'outfits_b'].map((n) => import(`/town/art/${n}.js`).then((m) => m.default || m)));
  mods = { anims: body_.anims, all: Object.assign({}, body_.sprites, hair.sprites, acc.sprites, oa.sprites, ob.sprites) };
  outfits = {};
  for (const m of [oa, ob]) for (const [k, v] of Object.entries(m.meta.outfits)) outfits[k] = v;
  accs = acc.meta.items;
  draw();
});
</script>
</body>
</html>
