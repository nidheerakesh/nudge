<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nudge avatar preview</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/css/app.css">
<style>
body{padding:12px 16px}
#bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
#bar label{display:flex;align-items:center;gap:6px;font-size:13px}
#bar select,#bar input,#bar button{width:auto;min-height:36px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);max-width:140px;word-break:break-all;text-align:center}
canvas.av{image-rendering:pixelated;border:1px solid var(--line);background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%);background-size:16px 16px;background-position:0 0,8px 8px}
#main{margin-bottom:16px}
#miss{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:8px;margin-top:16px}
</style>
</head>
<body>
<h1>Nudge avatar preview</h1>
<div id="bar"></div>
<div id="main"></div>
<div id="out"></div>
<div id="miss"></div>
<script type="module">
import loadAll from '/town/art/index.js';
import { SKINS, HAIR_NAMES } from '/town/art/palette.js';
import { getAvatarFrame, playAnim, drawAvatar, portrait } from '/town/avatar.js';
import oa from '/town/art/outfits_a.js';
import ob from '/town/art/outfits_b.js';
import acc from '/town/art/accessories.js';

const S = 4;
const OUT = Object.keys({ ...oa.meta.outfits, ...ob.meta.outfits });
const ACC = acc.meta.items;
const ANIMS = ['walk', 'idle', 'sit_study', 'break', 'cheer', 'knock'];
const LABEL = { walk: 'walk', idle: 'idle', sit_study: 'sit', break: 'break', cheer: 'cheer', knock: 'knock' };
const st = { skin: 1, hair: 1, hair_color: 1, outfit: 'outfit:casual', accessory: '', dir: 'd', anim: 'walk', play: true };
const state = { anim: 'walk', t: 0, frame: 0, dir: 'd' };
let mainCv = null;
let last = 0;
const rnd = (n) => 1 + Math.floor(Math.random() * n);

const el = (t, a, ...k) => {
  const n = document.createElement(t);
  for (const key in a || {}) n.setAttribute(key, a[key]);
  n.append(...k.filter((x) => x != null));
  return n;
};

function look(o) {
  const l = { ...st, ...o };
  return { skin: l.skin, hair: l.hair, hair_color: l.hair_color, outfit: l.outfit, accessory: l.accessory || null };
}

function randLook() {
  return {
    skin: rnd(6), hair: rnd(8), hair_color: rnd(8),
    outfit: 'outfit:' + OUT[Math.floor(Math.random() * OUT.length)],
    accessory: Math.random() < 0.2 ? null : 'acc:' + ACC[Math.floor(Math.random() * ACC.length)],
  };
}

function paint(cv, src, w, h) {
  cv.width = w * S;
  cv.height = h * S;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(src, 0, 0, cv.width, cv.height);
}

const canvas = () => el('canvas', { class: 'av' });

function sel(label, list, key) {
  const s = el('select');
  list.forEach(([v, t]) => { const o = el('option', { value: v }, t); if (String(st[key]) === String(v)) o.selected = true; s.append(o); });
  s.onchange = () => { st[key] = /^\d+$/.test(s.value) ? +s.value : s.value; if (key === 'anim' || key === 'dir') { state.anim = st.anim; state.dir = st.dir; state.t = 0; state.frame = 0; } draw(); };
  return el('label', null, label, s);
}

function cell(title, cv) {
  return el('div', { class: 'cell' }, cv, el('span', null, title));
}

function randomSix() {
  const g = el('div', { class: 'grid' });
  for (let i = 0; i < 6; i++) {
    const l = randLook();
    const cv = canvas();
    paint(cv, getAvatarFrame(l, 'idle', 'd', 0), 16, 24);
    const pc = canvas();
    paint(pc, portrait(l), 32, 32);
    g.append(cell(l.outfit + ' ' + (l.accessory || ''), cv), cell('portrait', pc));
  }
  return el('section', null, el('h2', null, '6 random looks'), g);
}

function allAnims() {
  const g = el('div', { class: 'grid' });
  const l = look();
  const row = (a, d, n) => {
    for (let f = 0; f < n; f++) {
      const cv = canvas();
      paint(cv, getAvatarFrame(l, a, d, f), 16, 24);
      g.append(cell(a + '.' + d + ' ' + f, cv));
    }
  };
  for (const d of ['d', 'u', 'l', 'r']) row('walk', d, 4);
  row('idle', 'd', 2);
  row('sit_study', 'd', 3);
  row('break', 'd', 3);
  row('cheer', 'd', 4);
  row('knock', 'u', 3);
  return el('section', null, el('h2', null, 'animation frames (current look)'), g);
}

function stress() {
  let n = 0;
  try {
    for (let i = 0; i < 200; i++) {
      const l = randLook();
      for (const a of ANIMS) for (const d of ['d', 'u', 'l', 'r']) getAvatarFrame(l, a, d, i % 4);
      portrait(l);
      n++;
    }
    for (let sk = 1; sk <= 6; sk++) for (let h = 1; h <= 8; h++) for (let c = 1; c <= 8; c++) {
      for (const o of OUT) getAvatarFrame({ skin: sk, hair: h, hair_color: c, outfit: 'outfit:' + o, accessory: 'acc:' + ACC[(sk + h + c) % ACC.length] }, 'walk', 'd', 1);
    }
    for (const o of OUT) for (const a of ACC) for (const d of ['d', 'u', 'l']) getAvatarFrame({ skin: 3, hair: 2, hair_color: 4, outfit: 'outfit:' + o, accessory: 'acc:' + a }, 'idle', d, 0);
    return 'ok ' + n + ' random looks, no errors';
  } catch (e) {
    console.error(e);
    return 'ERROR ' + e.message;
  }
}

function draw() {
  const bar = document.getElementById('bar');
  const btn = el('button', { type: 'button' }, st.play ? 'pause' : 'play');
  btn.onclick = () => { st.play = !st.play; draw(); };
  const rb = el('button', { type: 'button' }, 'random');
  rb.onclick = () => { Object.assign(st, randLook()); st.accessory = st.accessory || ''; draw(); };
  const tb = el('button', { type: 'button' }, 'run 200 random');
  tb.onclick = () => { document.getElementById('miss').replaceChildren(stress()); };
  bar.replaceChildren(
    sel('Skin', SKINS.map((_, i) => [i + 1, 'tone ' + (i + 1)]), 'skin'),
    sel('Hair style', HAIR_NAMES.map((_, i) => [i + 1, 'style ' + (i + 1)]), 'hair'),
    sel('Hair colour', HAIR_NAMES.map((n, i) => [i + 1, n]), 'hair_color'),
    sel('Outfit', OUT.map((k) => ['outfit:' + k, k]), 'outfit'),
    sel('Accessory', [['', 'none'], ...ACC.map((a) => ['acc:' + a, a])], 'accessory'),
    sel('Direction', ['d', 'u', 'l', 'r'].map((d) => [d, d]), 'dir'),
    sel('Animation', ANIMS.map((a) => [a, LABEL[a]]), 'anim'),
    btn, rb, tb,
  );
  mainCv = canvas();
  document.getElementById('main').replaceChildren(mainCv);
  document.getElementById('out').replaceChildren(randomSix(), allAnims());
  frame();
}

function frame() {
  if (!mainCv) return;
  paint(mainCv, getAvatarFrame(look(), state.anim, state.dir, state.frame), 16, 24);
}

function loop(ts) {
  const dt = Math.min(0.25, (ts - last) / 1000);
  last = ts;
  if (st.play) {
    playAnim(state, dt);
    frame();
  }
  requestAnimationFrame(loop);
}

loadAll().then(() => {
  draw();
  document.getElementById('miss').replaceChildren(stress());
  window.drawAvatar = drawAvatar;
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
