<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nudge</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F7F3FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1025" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --color-primary:#7C3AED;--color-on-primary:#FFFFFF;--color-secondary:#6D28D9;--color-on-secondary:#FFFFFF;
  --color-accent:#BE185D;--color-on-accent:#FFFFFF;--color-background:#F7F3FF;--color-foreground:#2E1A47;
  --color-card:#FFFFFF;--color-card-foreground:#2E1A47;--color-muted:#EDE6FB;--color-muted-foreground:#5B4A75;
  --color-border:#DDD3F5;--color-destructive:#B91C1C;--color-on-destructive:#FFFFFF;--color-ring:#7C3AED;
  --color-hl:#FCE7F3;--color-on-hl:#831843;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;--space-2xl:48px;
  --r:12px;--t:180ms ease;
  --shadow-md:0 4px 6px rgba(0,0,0,.15);--shadow-lg:0 20px 25px rgba(0,0,0,.25);--scrim:rgba(26,16,37,.55);
}
@media(prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --color-primary:#C4B5FD;--color-on-primary:#1A1025;--color-secondary:#A78BFA;--color-on-secondary:#1A1025;
    --color-accent:#F472B6;--color-on-accent:#1F0A16;--color-background:#1A1025;--color-foreground:#F1EAFE;
    --color-card:#241733;--color-card-foreground:#F1EAFE;--color-muted:#33224A;--color-muted-foreground:#C4B5DD;
    --color-border:#3D2A57;--color-destructive:#F87171;--color-on-destructive:#1A0000;--color-ring:#C4B5FD;
    --color-hl:#4A1B3A;--color-on-hl:#FBCFE8;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--color-foreground);font:16px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:calc(132px + env(safe-area-inset-bottom));overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:not(:disabled):active{opacity:.7}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700;margin-bottom:4px}
button,input,select,textarea{font:inherit;color:inherit}
button,summary,label,select{cursor:pointer}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:2px}
::placeholder{color:var(--color-muted-foreground);opacity:1}
.skip{position:absolute;left:8px;top:-60px;z-index:20;background:var(--color-card);color:var(--color-foreground);border:2px solid var(--color-primary);border-radius:8px;padding:10px 16px;font-weight:600}
.skip:focus{top:8px}
#app:focus:not(:focus-visible){outline:none}
html{scroll-padding-top:72px;scroll-padding-bottom:calc(140px + env(safe-area-inset-bottom))}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

header{position:sticky;top:0;z-index:6;background:var(--color-background);border-bottom:1px solid var(--color-border)}
.top{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:700;font-size:20px;margin-right:auto}
#stk{font-size:14px;color:var(--color-muted-foreground)}
#mini{border:2px solid var(--color-primary);background:transparent;border-radius:999px;padding:0 14px;min-height:44px;font-weight:700;font-variant-numeric:tabular-nums}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--color-card);border-top:1px solid var(--color-border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;max-width:150px;border:0;background:transparent;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--color-muted-foreground);position:relative;transition:color var(--t)}
.tab.on{color:var(--color-foreground)}
.tab.on::before{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--color-primary)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--color-primary);color:var(--color-on-primary);border-radius:999px;font-size:12px;padding:0 6px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--color-muted);border-radius:24px;padding:4px;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;flex:1 1 auto;padding:0 14px;min-height:44px;font-weight:600;color:var(--color-muted-foreground);white-space:nowrap;transition:background var(--t)}
.seg button.on{background:var(--color-card);color:var(--color-foreground);box-shadow:inset 0 0 0 2px var(--color-primary)}

.wrap{max-width:760px;margin:0 auto;padding:16px;display:grid;gap:16px;min-width:0}
.card{background:var(--color-card);color:var(--color-card-foreground);border:1px solid var(--color-border);border-radius:var(--r);padding:var(--space-md);min-width:0}
.card.past{opacity:.6}
.hero{background:var(--color-card);border:2px solid var(--color-primary);border-radius:16px;padding:var(--space-lg)}
.ey{font-size:14px;font-weight:600;color:var(--color-muted-foreground);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:clamp(24px,6vw,38px);line-height:1.15;font-weight:700;overflow-wrap:anywhere}
.sub{margin-top:8px;font-size:17px;color:var(--color-muted-foreground)}
.center{text-align:center}
.mut{color:var(--color-muted-foreground)}
.small{font-size:14px}
.qm{font-size:14px;color:var(--color-muted-foreground);margin-top:8px}

.btn{border:2px solid var(--color-primary);border-radius:8px;padding:0 16px;min-height:44px;background:transparent;color:var(--color-foreground);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background var(--t),opacity var(--t)}
.btn:hover{background:var(--color-muted)}
.btn.fill{background:var(--color-primary);color:var(--color-on-primary)}
.btn.fill:hover{opacity:.9}
.btn.cta{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent);font-weight:700}
.btn.cta:hover{opacity:.9}
.btn.lg{min-height:56px;padding:0 24px;font-size:18px}
.btn.wide{width:100%}
.btn.s{font-size:14px;padding:0 12px}
.btn.ghost{border-color:var(--color-border)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.row.c{justify-content:center}
.row.sb{justify-content:space-between;align-items:flex-start;margin-top:0}
.row.t{margin-top:10px}

.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.chip{border:1px solid var(--color-border);background:transparent;color:inherit;border-radius:999px;padding:0 14px;min-height:44px;font-weight:500;transition:background var(--t)}
.chip:hover{background:var(--color-muted)}
.chip.on{background:var(--color-muted);border:2px solid var(--color-primary);font-weight:700}
.num{width:84px;min-height:44px}

.strip{display:grid;gap:12px}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--color-muted-foreground);font-size:15px}
.stat b{color:var(--color-foreground);font-size:20px;margin-right:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{text-align:left;background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;transition:border-color var(--t)}
.tile:hover{border-color:var(--color-primary)}
.tn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc{font-size:22px;font-weight:700}

.bar{height:10px;background:var(--color-muted);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar.sm{height:6px;margin:2px 0}
.bar i{display:block;height:100%;background:var(--color-primary);border-radius:99px;transition:width .3s}
.clock{font-size:clamp(56px,16vw,110px);font-weight:700;line-height:1;margin-top:20px;font-variant-numeric:tabular-nums}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--color-muted);border:2px solid var(--color-primary);border-radius:var(--r);padding:10px 14px}
.sp{flex:1}

.list{list-style:none;margin:8px 0 0;padding:0;display:grid}
.list li{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--color-border);flex-wrap:wrap;min-width:0}
.list li:first-child{border-top:0}
.list label,.list .lt{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.list li.dn label{text-decoration:line-through;color:var(--color-muted-foreground)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--color-primary);flex:none;margin:0}
.tag{font-size:13px;background:var(--color-muted);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag.bad{background:var(--color-destructive);color:var(--color-on-destructive)}
.x{border:0;background:transparent;color:var(--color-muted-foreground);width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;flex:none;transition:background var(--t),color var(--t)}
.x:hover{background:var(--color-muted);color:var(--color-destructive)}
.x.mv:hover{color:var(--color-primary)}
.x:disabled{opacity:.4;cursor:default}
.x:disabled:hover{background:transparent;color:var(--color-muted-foreground)}
.mvr{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.mvr input{width:150px}
.pl label{flex-basis:200px}
.pl .mvr{margin-left:auto}
.ev{background:var(--color-hl);color:var(--color-on-hl);border-left:4px solid var(--color-accent);border-radius:8px;padding:6px 12px;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;min-width:0;overflow-wrap:anywhere}
.ev .btn{color:var(--color-on-hl);border-color:var(--color-on-hl)}
.card.now{border:2px solid var(--color-primary)}
.tag.td{background:var(--color-primary);color:var(--color-on-primary);font-weight:700}
.cdw{font-size:26px;font-weight:700;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-bottom:8px}

.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0;flex-basis:180px}
input:not([type=checkbox]),select,textarea{background:var(--color-background);border:1px solid var(--color-muted-foreground);border-radius:8px;padding:0 12px;min-height:44px;font-size:16px;max-width:100%;transition:border-color var(--t)}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--color-ring);outline-offset:2px}
textarea{width:100%;resize:vertical;margin:10px 0;padding:10px 12px}
details>summary{font-weight:700;margin-top:12px;min-height:44px;display:flex;align-items:center}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:44px;height:44px;border-radius:50%;border:1px solid var(--color-muted-foreground);background:transparent;font-size:12px;color:var(--color-muted-foreground);transition:background var(--t)}
.dot.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary);font-weight:700}
.dot.td{outline:2px solid var(--color-foreground);outline-offset:1px}
.bal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bal div{background:var(--color-muted);border-radius:8px;padding:8px 10px;font-size:14px}
.bal b{display:block;font-size:20px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--color-foreground);color:var(--color-background);padding:10px 18px;border-radius:var(--r);opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast{display:flex;gap:8px;align-items:center;justify-content:center;width:max-content}
#toast span{min-width:0;overflow-wrap:anywhere}
#toast button{border:2px solid currentColor;background:transparent;color:inherit;border-radius:8px;min-height:44px;padding:0 12px;font-weight:700}
#toast button:focus-visible{outline-color:var(--color-background)}
.pd{content-visibility:auto;contain-intrinsic-size:auto 220px}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:8;border-radius:999px;box-shadow:var(--shadow-md)}
#chat{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100%;z-index:7;background:var(--color-card);color:var(--color-card-foreground);border-left:1px solid var(--color-border);display:flex;flex-direction:column}
#chat.sheet{width:420px;z-index:10;box-shadow:var(--shadow-lg),0 0 0 100vmax var(--scrim)}
body.cw{padding-right:360px}
body.cw #nav{right:360px}
#toast{z-index:12}
.ch{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--color-border)}
.ch h2{margin-right:auto;font-size:18px}
.cl{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.mb{max-width:88%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.mb.u{align-self:flex-end;background:var(--color-primary);color:var(--color-on-primary);border-bottom-right-radius:4px}
.mb.a{align-self:flex-start;background:var(--color-muted);color:var(--color-foreground);border-bottom-left-radius:4px}
.cax{border:1px solid var(--color-border);border-radius:var(--r);padding:8px 12px;align-self:stretch}
.cax ul{list-style:none;margin:0 0 8px;padding:0}
.cax label{display:flex;gap:8px;align-items:center;min-height:44px;font-size:15px;overflow-wrap:anywhere}
.cf{padding:8px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--color-border)}
.cf textarea{margin:4px 0 0;min-height:64px}
.cla{font-size:14px;font-weight:600}
.cer{font-size:14px;color:var(--color-muted-foreground);flex:1;min-width:0}
@media(max-width:600px){#chat.sheet{width:100%}}
@media(max-width:600px){.hero{padding:18px}.wrap{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.thm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tb{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 10px;border:1px solid var(--color-border);border-radius:var(--r);background:var(--color-card);color:var(--color-card-foreground);font:inherit;text-align:left;cursor:pointer}
.tb.on{border:2px solid var(--color-primary)}
.tb i{display:inline-block}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header>
  <div class="top">
    <div class="brand">Nudge</div>
    <button id="mini" hidden></button>
    <span id="stk"></span>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<nav id="nav" aria-label="Sections"></nav>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
function h(t,a,...c){
  const e=document.createElement(t);
  for(const k in (a||{})){
    const v=a[k];
    if(v===false||v==null)continue;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value'){e.value=v;e._v=e.value;}
    else if(k==='checked')e.checked=v;
    else e.setAttribute(k,v);
  }
  for(const x of c.flat(9)){
    if(x==null||x===false)continue;
    e.append(x.nodeType?x:document.createTextNode(String(x)));
  }
  return e;
}
const P={
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  flag:'<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  menu:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  play:'<path d="M7 4v16l13-8z"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  cl:'<path d="m15 18-6-6 6-6"/>',
  cr:'<path d="m9 18 6-6-6-6"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>'
};
function I(n){const s=document.createElement('span');s.className='ic';s.setAttribute('aria-hidden','true');s.innerHTML='<svg viewBox="0 0 24 24">'+P[n]+'</svg>';return s;}

let PIN=localStorage.getItem('pin')||'';
async function api(m,p,b,re){
  const r=await fetch('/api/'+p,{method:m,headers:{'content-type':'application/json','x-pin':PIN},body:b?JSON.stringify(b):undefined});
  if(r.status===401){
    if(re){toast('Wrong PIN. Try again from the action.');throw new Error('pin');}
    const v=prompt('Enter your PIN');
    if(v===null)throw new Error('pin');
    PIN=v;localStorage.setItem('pin',PIN);
    return api(m,p,b,1);
  }
  if(!r.ok){
    let x='';try{x=(await r.json()).error||'';}catch(e){}
    const er=new Error(x||'HTTP '+r.status);er.api=1;throw er;
  }
  return r.json();
}

const E={courses:[],topics:[],tasks:[],quizzes:[],qt:[],dump:[],rem:[],habits:[],hlog:[],log:[],areas:[],goals:[],steps:[],today:[],routines:[],rsteps:[],rlog:[],notes:[]};
let S=Object.assign({},E);
const VW=['today','inbox','goals','now','plan','exams','tasks','quiz','rem','hab','rout','areas','log'];
const hk=()=>{const k=location.hash.slice(1);return VW.includes(k)?k:null;};
let tab=hk()||localStorage.getItem('tab')||'today';
let mode=localStorage.getItem('mode')||'exam';
let skip=0;
const openQ=new Set();
const TOP=[['today','Today','sun',['today']],['inbox','Inbox','inbox',['inbox']],['goals','Goals','flag',['goals']],['study','Study','book',['now','plan','exams','tasks','quiz']],['more','More','menu',['rout','hab','rem','areas','log']]];
const NM={now:'Focus',plan:'Plan',exams:'Exams',tasks:'Tasks',quiz:'Quizzes',rout:'Routines',hab:'Habits',rem:'Reminders',areas:'Areas and notes',log:'Log'};
let pk=null,pmsg='',bmsg={},gsel=null;

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const dd=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const lt=ms=>new Date(ms-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fd=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const rel=d=>{const n=dd(d);return n===0?'today':n===1?'tomorrow':n>1?'in '+n+'d':(-n)+'d overdue';};
const pad=n=>String(n).padStart(2,'0');
const cname=id=>(S.courses.find(c=>c.id===id)||{}).name||'';
const aname=id=>(S.areas.find(a=>a.id===id)||{}).name||'';
const key=c=>c.date+(c.time||'09:00');
const upc=()=>S.courses.filter(c=>c.date&&dd(c.date)>=0).sort((a,b)=>key(a)>key(b)?1:-1);
const prog=c=>{const t=S.topics.filter(x=>x.course_id===c.id);return[t.filter(x=>x.done).length,t.length];};
const bys=(a,b)=>(a.sort||0)-(b.sort||0)||a.id-b.id;
const tdy=()=>S.today.filter(x=>x.day===today()).sort(bys);
const gsteps=g=>S.steps.filter(s=>s.goal_id===g.id).sort(bys);

function cd(c){
  const t=new Date(c.date+'T'+(c.time||'09:00')+':00')-Date.now();
  if(t<=0)return dd(c.date)<0?'over':'now';
  const d=Math.floor(t/864e5),hr=Math.floor(t%864e5/36e5);
  return d>0?d+'d '+hr+'h':hr+'h '+Math.floor(t%36e5/6e4)+'m';
}
function pd(s){
  s=s.trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const x=new Date(/\b\d{4}\b/.test(s)?s:s+' '+new Date().getFullYear());
  return isNaN(x)?null:ymd(x);
}
function streak(days){
  const s=new Set(days);let n=0;const d=new Date();
  if(!s.has(ymd(d)))d.setDate(d.getDate()-1);
  while(s.has(ymd(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function last7(days){
  const s=new Set(days);let n=0;const d=new Date();
  for(let i=0;i<7;i++){if(s.has(ymd(d)))n++;d.setDate(d.getDate()-1);}
  return n;
}

let ac;
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function askNotif(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}}
function beep(){
  try{
    if(!ac)return;
    [0,.28,.56].forEach(t=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=t===.56?880:660;
      o.connect(g);g.connect(ac.destination);
      const s=ac.currentTime+t;
      g.gain.setValueAtTime(.0001,s);
      g.gain.exponentialRampToValueAtTime(.2,s+.02);
      g.gain.exponentialRampToValueAtTime(.0001,s+.22);
      o.start(s);o.stop(s+.25);
    });
  }catch(e){}
}
function ping(t,b){
  toast(t+': '+b);beep();
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:b});}catch(e){}
}

function paint(){
  const t=getTm(),el=$('#tmr'),mi=$('#mini'),rg=$('#ring');
  if(t&&!t.fin){
    const s=Math.max(0,Math.ceil((t.end-Date.now())/1e3));
    const txt=pad(Math.floor(s/60))+':'+pad(s%60);
    if(el)el.textContent=txt;
    if(rg)rg.style.width=Math.min(100,100*(1-(t.end-Date.now())/(t.total*6e4)))+'%';
    mi.textContent=(t.mode==='focus'?'Focus ':'Break ')+txt;mi.hidden=false;

function tick(){
  const t=getTm();

    if(t.mode==='focus'){

      addLog('focus',t.ref?t.ref.title:'Focus',t.total);
      ping('Round complete','Nice work. Take a breather.');

    }else{setTm(null);ping('Break over','Ready for the next thing?');render(1);}
  }
  if(rq&&!isF(document.activeElement))render(1);

function cands(){
  const up=upc(),out=[],seen=new Set();
  const put=o=>{const k=o.k+o.id;if(!seen.has(k)){seen.add(k);out.push(o);}};
  const und=c=>S.topics.filter(t=>t.course_id===c.id&&!t.done).sort((a,b)=>a.id-b.id);
  const sub=c=>c.name+', '+(c.kind==='oa'?'OA':'exam')+' in '+cd(c);
  if(mode==='exam'){
    up.forEach(c=>{
      und(c).forEach(t=>put({k:'topics',id:t.id,title:t.title,sub:sub(c)}));
      S.tasks.filter(x=>x.course_id===c.id&&!x.done&&x.kind==='todo').forEach(x=>put({k:'tasks',id:x.id,title:x.title,sub:c.name+', to-do'}));
    });
    S.tasks.filter(x=>!x.done&&x.due&&dd(x.due)<=1).forEach(x=>put({k:'tasks',id:x.id,title:x.title,sub:(cname(x.course_id)||'General')+', due '+rel(x.due)}));
    S.quizzes.filter(q=>!q.done&&q.date&&dd(q.date)<=1).forEach(q=>put({k:'quizzes',id:q.id,title:'Quiz: '+q.title,sub:cname(q.course_id)+', '+rel(q.date)}));
  }else{
    const L=[];
    S.tasks.filter(x=>!x.done).forEach(x=>L.push({due:x.due||'9999',o:{k:'tasks',id:x.id,title:x.title,sub:(cname(x.course_id)||'General')+', '+(x.kind==='assignment'?'assignment':'to-do')+(x.due?', due '+rel(x.due):'')}}));
    S.quizzes.filter(q=>!q.done).forEach(q=>L.push({due:q.date||'9999',o:{k:'quizzes',id:q.id,title:'Quiz: '+q.title,sub:cname(q.course_id)+(q.date?', '+rel(q.date):'')}}));
    up.forEach(c=>{const t=und(c)[0];if(t)L.push({due:c.date,o:{k:'topics',id:t.id,title:t.title,sub:sub(c)}});});
    L.sort((a,b)=>a.due>b.due?1:a.due<b.due?-1:0).forEach(x=>put(x.o));
  }
  return out;
}

}
function cmsg(m){
  const b=h('div',{class:'mb '+(m.role==='user'?'u':'a')},m.content);
  if(!m.acts||!m.acts.length)return[b];
  if(m.ap)return[b,h('div',{class:'mut small'},'Changes applied.')];
  const n=m.sel.filter(Boolean).length;
  return[b,h('div',{class:'cax'},h('div',{class:'cla'},'Proposed changes'),
    h('ul',{},m.acts.map((a,i)=>h('li',{},h('label',{},h('input',{type:'checkbox',checked:!!m.sel[i],onchange:e=>{m.sel[i]=e.target.checked;csave();crender();}}),al(a))))),
    h('button',{class:'btn cta s',disabled:!n||!!cbusy,onclick:()=>capply(m)},'Apply selected'))];
}
function crender(){
  const xs=CH.length?CH.flatMap(cmsg):[h('div',{class:'mb a'},'Hi. Ask me to plan around a quiz, shift your day, or pick what to do next. I suggest changes and you choose what to apply.'),
    h('div',{class:'chips',style:'margin-top:0'},['I have an AI quiz Monday on the first half','I lost today, push everything one day','What should I do today?'].map(s=>h('button',{class:'chip',onclick:()=>csend(s)},s)))];
  if(cbusy)xs.push(h('div',{class:'mb a mut',role:'status'},'Thinking…'));
  cl.replaceChildren(...xs);
  cer.textContent=cerr;csb.disabled=!!cbusy;
  cl.scrollTop=cl.scrollHeight;
}
async function csend(v){
  v=(v||'').trim();if(!v||cbusy)return;
  CH.push({role:'user',content:v});cta.value='';cerr='';cbusy=1;csave();crender();
  try{
    const r=await api('POST','ai/chat',{day:today(),messages:CH.slice(-12).map(m=>({role:m.role,content:m.content}))});
    if(!r||typeof r.reply!=='string')throw 0;
    const a=Array.isArray(r.actions)?r.actions:[];
    CH.push({role:'assistant',content:r.reply,acts:a,sel:a.map(()=>true)});
  }catch(e){cerr='Nudge could not answer right now. Try again in a moment.';}
  cbusy=0;csave();crender();
}
async function cdo(a,nt){
  const t=a.id?S.tasks.find(x=>x.id===a.id):null;
  if(a.op==='move_task'){if(!t)return 0;await api('PATCH','tasks/'+a.id,{due:cap(t.course_id,a.due)});return 1;}
  if(a.op==='done_task'){if(!t)return 0;await api('PATCH','tasks/'+a.id,{done:1});addLog('tasks',t.title,0);return 1;}
  if(a.op==='delete_task'){if(!t)return 0;await api('DELETE','tasks/'+a.id);return 1;}
  if(a.op==='add_task'){await api('POST','tasks',{title:a.title,course_id:a.course_id||null,kind:'todo',due:a.due?cap(a.course_id,a.due):null});return 1;}
  if(a.op==='add_quiz'){const r=await api('POST','quizzes',{course_id:a.course_id,title:a.title,date:a.date});if(r&&r.id&&a.topic_ids&&a.topic_ids.length)await api('POST','qt',a.topic_ids.map(id=>({quiz_id:r.id,topic_id:id})));return 1;}
  if(a.op==='replan_course'){await load();const p=mkRp('c:'+a.course_id);if(!p)return 0;await Promise.all(p.mv.filter(m=>m.t.due!==m.d).map(m=>api('PATCH','tasks/'+m.t.id,{due:m.d})));if(p.warn)nt.push(p.warn);return 1;}
  if(a.op==='add_today'){await load();if(tdy().length>=3){nt.push('Today already had 3, so "'+a.title+'" was skipped.');return 0;}await api('POST','today',{day:today(),title:a.title,sort:tdy().length,done:0});return 1;}
  return 0;
}
async function capply(m){
  const xs=m.acts.filter((a,i)=>m.sel[i]);if(!xs.length||cbusy)return;
  cbusy=1;crender();let n=0;const nt=[];
  for(const a of xs){try{if(await cdo(a,nt))n++;}catch(e){nt.push('One change failed.');}}
  m.ap=1;
  try{await load();}catch(e){fail(e);}
  if(nt.includes('One change failed.'))toast(SV,{err:1});
  render();
  CH.push({role:'assistant',content:'Applied '+n+(n===1?' change.':' changes.')+(nt.length?' '+nt.join(' '):'')});
  cbusy=0;csave();crender();
}
clay();crender();

$('#mini').addEventListener('click',()=>go('today'));
(async()=>{
  if(location.hash!=='#'+tab)history.replaceState(null,'','#'+tab);
  try{await load();}catch(e){toast('Could not load your data. Check the connection and refresh.',{err:1});}
  theme();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",theme);
  render();tick();crender();
})();
</script>
